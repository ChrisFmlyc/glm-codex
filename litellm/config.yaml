# LiteLLM proxy config.
# Translates the Anthropic Messages API (what Claude Code speaks) to the
# OpenAI Chat Completions API (what vLLM speaks).
#
# Values come from .env - you should not need to edit this file.
#
# NOTE: keep this file pure ASCII. A smart quote or em-dash pasted into a
# comment is saved as cp1252 and read back as UTF-8, giving:
#   UnicodeDecodeError: 'utf-8' codec can't decode byte 0x97

model_list:
  # Main model. Claude Code's primary.
  - model_name: glm53
    litellm_params:
      # The part after openai/ must match your server's --served-model-name.
      # Change it if yours differs.
      model: openai/glm53-uncensored
      api_key: os.environ/GLM_API_KEY
      api_base: os.environ/GLM_BASE_URL
    model_info:
      # Claude Code does NOT read these - see README. They matter for other
      # clients and for /model/info. Must match the server's --max-model-len.
      max_input_tokens: 1048576
      max_output_tokens: 16384
      max_tokens: 1048576

  # Claude Code separately calls a small/fast model for titles and summaries.
  # If it is unmapped, background tasks fail in confusing ways.
  # We only have one model, so both names point at the same backend.
  - model_name: glm53-small
    litellm_params:
      model: openai/glm53-uncensored
      api_key: os.environ/GLM_API_KEY
      api_base: os.environ/GLM_BASE_URL
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 16384
      max_tokens: 1048576

litellm_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Anthropic sends params some OpenAI backends reject. Drop them instead
  # of erroring.
  drop_params: true
